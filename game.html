<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Game for cat</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap"
			rel="stylesheet"
		/>
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="img/favicon/apple-touch-icon.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="img/favicon/favicon-32x32.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="img/favicon/favicon-16x16.png"
		/>
		<link rel="manifest" href="img/favicon/site.webmanifest" />

		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<div id="pauseScreen">
			<h1>Need a minute?</h1>
			<p>Use the following controls to play:</p>
			<div class="controls-container">
				<div class="move-controls">
					<div class="key">↑</div>
					<div class="horizontal-keys">
						<div class="key">←</div>
						<div class="key">↓</div>
						<div class="key">→</div>
					</div>
					<div>Moves</div>
				</div>
				<div class="action-controls">
					<li>
						<div class="key space-key">Space</div>
						Attack
					</li>
					<li>
						<div class="key space-key">Escape</div>
						Pause
					</li>
				</div>
			</div>
		</div>

		<div id="gameOverScreen" class="hidden">
			<h1 id="gameOverTitle"></h1>
			<p id="gameOverMessage"></p>
			<button id="restartButton">Restart Game</button>
		</div>

		<canvas id="canvas1"></canvas>

		<img id="player" src="img/player.png" />

		<img id="layer1" src="img/layer-1.png" />
		<img id="layer2" src="img/layer-2.png" />
		<img id="layer3" src="img/layer-3.png" />
		<img id="layer4" src="img/layer-4.png" />
		<img id="layer5" src="img/layer-5.png" />

		<img id="enemy_fly" src="img/enemy_fly.png" />
		<img id="enemy_plant" src="img/enemy_plant.png" />
		<img id="enemy_spider_big" src="img/enemy_spider_big.png" />

		<img id="friend_fly" src="img/friend_fly.png" />
		<img id="friend_plant" src="img/friend_plant.png" />

		<img id="fire" src="img/fire.png" />

		<img id="heart" src="img/heart.png" />

		<img id="collisionAnimation" src="img/boom.png" />

		<script type="module" src="script.js"></script>
	</body>
</html>
